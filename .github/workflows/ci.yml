name: CI
# CI for rvt-open. Every action is pinned to a full commit SHA.
# Test data: public samples only (Autodesk's own sample downloads, VTT's BIM4LCA models), fetched by
# tools/ci/fetch-public-samples.sh and cached. Tests whose files have no public source skip and say so.
on:
  push:
    branches: [main]
  # A draft pull request runs the fast jobs (samples, box check, fmt, clippy,
  # rvt-dwg); marking it ready runs the rest. No job waits for another unless
  # it uses what that job makes, so they all start together.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      daylight_sweep:
        description: Run every Daylight analysis on every public sample (job "daylight on every public sample")
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  # A draft's fast run and the full run marking it ready starts are in groups
  # of their own, so marking a draft ready does not cancel its fast run.
  group: ci-${{ github.ref }}-${{ github.event.pull_request.draft && 'fast' || 'full' }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.98.0"
  PARTITIONS: 4

jobs:
  identity:
    name: identity check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, fetch-depth: 0 }
      - run: tools/ci/identity-check.sh
        env:
          IDENTITY_DENYLIST: ${{ secrets.IDENTITY_DENYLIST }}
          IDENTITY_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
      - if: github.event_name == 'pull_request'
        run: tools/ci/identity-check.sh --commits "$BASE..$HEAD"
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          IDENTITY_DENYLIST: ${{ secrets.IDENTITY_DENYLIST }}
          IDENTITY_FORK_PR: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
  # What the change can affect (tools/ci/change-scope.sh): a pull request of
  # prose alone runs no Rust job, and a push to main of a tree whose pull
  # request already passed the full jobs runs none again. The changelog
  # fragments are checked here, so a prose-only change still is.
  scope:
    name: what the change can affect
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      skip: ${{ steps.scope.outputs.skip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: python3 tools/release/changelog.py check
      - id: scope
        run: tools/ci/change-scope.sh >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.sha }}
  samples:
    name: Fetch public samples
    needs: scope
    if: needs.scope.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: { path: _samples, key: "samples-v1-${{ hashFiles('research/autodesk-sample-projects.tsv', 'research/bim4lca-models.tsv', 'tools/ci/fetch-public-samples.sh') }}", lookup-only: true }
      - if: steps.cache.outputs.cache-hit != 'true'
        run: tools/ci/fetch-public-samples.sh _samples > _samples.env && cat _samples.env
      - if: steps.cache.outputs.cache-hit != 'true'
        run: mv _samples.env _samples/env
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: { path: _samples, key: "samples-v1-${{ hashFiles('research/autodesk-sample-projects.tsv', 'research/bim4lca-models.tsv', 'tools/ci/fetch-public-samples.sh') }}" }

  box-check:
    name: Box check
    needs: samples
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: tools/ci/retry.sh 3 rustup toolchain install "$RUST_VERSION" --profile minimal && rustup default "$RUST_VERSION"
      # The one job that saves the ci-profile cache (the others only restore
      # it), so the cache holds what it held when every job waited for this one.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: { shared-key: ci-profile }
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: { path: _samples, key: "samples-v1-${{ hashFiles('research/autodesk-sample-projects.tsv', 'research/bim4lca-models.tsv', 'tools/ci/fetch-public-samples.sh') }}", fail-on-cache-miss: true }
      - run: sed "s|^\([A-Z0-9_]*=\).*/_samples/|\1$GITHUB_WORKSPACE/_samples/|" _samples/env >> "$GITHUB_ENV"
      - name: Einhoven (MIT, Revit 2023)
        uses: ./.github/actions/fetch-corpus
        with: { repository: magnetar-io/revit-test-datasets, path: _project_corpus }
      - run: echo "RVT_PROJECT_CORPUS_DIR=$GITHUB_WORKSPACE/_project_corpus/Revit" >> "$GITHUB_ENV"
      - run: cargo run --profile ci --example box_check -- tools/ci/box-baseline.tsv
        env: { BOX_CHECK_JOBS: "3" }
      # Every public sample's sun settings and view display options, kept for the measurement
      # against the samples' Revit API dumps.
      - name: Sun settings of the public samples
        run: |
          cargo build --profile ci --example sun_settings
          dirs=$(ls -d _samples/flat _samples/bim4lca 2>/dev/null || true)
          find -L $dirs -name '*.rvt' -print0 | sort -z | xargs -0 target/ci/examples/sun_settings > "$RUNNER_TEMP/sun-settings.jsonl"
          wc -l "$RUNNER_TEMP/sun-settings.jsonl"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: sun-settings, path: "${{ runner.temp }}/sun-settings.jsonl", retention-days: 7 }

  fmt:
    name: cargo fmt
    needs: scope
    if: needs.scope.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: tools/ci/retry.sh 3 rustup toolchain install "$RUST_VERSION" --profile minimal -c rustfmt && rustup default "$RUST_VERSION"
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy and docs
    needs: scope
    if: needs.scope.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: tools/ci/retry.sh 3 rustup toolchain install "$RUST_VERSION" --profile minimal -c clippy && rustup default "$RUST_VERSION"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo check --lib --bins
        env: { RUSTFLAGS: "-D warnings -D unnameable_types" }
      - run: cargo doc --no-deps --lib
        env: { RUSTDOCFLAGS: "-D warnings" }

  build:
    name: build / ${{ matrix.os }}
    needs: scope
    if: needs.scope.outputs.skip != 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: tools/ci/retry.sh 3 rustup toolchain install "${{ env.RUST_VERSION }}" --profile minimal && rustup default "${{ env.RUST_VERSION }}"
        shell: bash
      # The hosted Ubuntu image ships about 30 GB of SDKs this job never uses; the debug build of the
      # whole workspace plus the ClamAV image no longer fit beside them.
      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --workspace --lib --bins --all-features
      - run: cargo test --profile ci --doc
      - run: cargo run --profile ci --example basics_inspect
      - run: cargo run --profile ci --example basics_elements

  # The same binaries build / ubuntu-24.04 builds (the same command on the same
  # runner image, restoring the same cache), scanned beside it rather than after it.
  clamav:
    name: ClamAV scan of the built binaries
    needs: scope
    if: needs.scope.outputs.skip != 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      # The hosted image ships about 30 GB of SDKs this job never uses; the debug build of the whole
      # workspace plus the ClamAV image do not fit beside them. Removed while the build runs.
      - run: |
          (sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL; touch "$RUNNER_TEMP/freed") &
          tools/ci/retry.sh 3 rustup toolchain install "$RUST_VERSION" --profile minimal && rustup default "$RUST_VERSION"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: { shared-key: build, save-if: false }
      - run: cargo build --workspace --lib --bins --all-features
      # The signature database, a day at a time: freshclam then fetches only what changed since.
      - id: date
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: { path: "${{ runner.temp }}/clamav-db", key: "clamav-db-${{ steps.date.outputs.day }}", restore-keys: clamav-db- }
      # ClamAV (GPL-2.0) runs here as a separate program only; it is never linked into or shipped with rvt-open.
      - name: ClamAV scan of the built binaries (official clamav image, pinned in the script)
        env: { CLAMAV_DB: "${{ runner.temp }}/clamav-db" }
        run: |
          while [ ! -e "$RUNNER_TEMP/freed" ]; do sleep 5; done; df -h /
          tools/ci/clamav-scan.sh "$RUNNER_TEMP/clamav.md" "$RUNNER_TEMP/clamav.log" $(find target/debug -maxdepth 1 -type f -executable -name 'rvt-*')
          cat "$RUNNER_TEMP/clamav.md" >> "$GITHUB_STEP_SUMMARY"
          grep '^TIME: ' "$RUNNER_TEMP/clamav.log"

  dwg:
    name: rvt-dwg (DWG/DXF, ACadSharp samples)
    needs: scope
    if: needs.scope.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: tools/ci/retry.sh 3 rustup toolchain install "$RUST_VERSION" --profile minimal && rustup default "$RUST_VERSION"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: { shared-key: ci-profile, save-if: false }
      - id: dwg-samples
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: { path: _dwg_samples, key: "dwg-samples-${{ hashFiles('rvt-dwg/tools/fetch-acadsharp-samples.sh') }}" }
      # MIT sample drawings, pinned by commit and SHA-256 in the script.
      - run: rvt-dwg/tools/fetch-acadsharp-samples.sh _dwg_samples
      - run: cargo test --profile ci -p rvt-dwg
        env: { RVT_DWG_SAMPLES: "${{ github.workspace }}/_dwg_samples" }

  # The viewer's daylight tier (daylight-rt) against Radiance 6.0.3's answers on the CC0 demo building
  # (daylight-rt/tests/data/demo-building): sun hours equal on every sensor, the sky view factor and the
  # daylight-factor preview within their measured error, and the scene built from the .rvt itself.
  daylight:
    name: daylight-rt (sun, sky view, daylight factor against Radiance)
    needs: scope
    if: needs.scope.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: tools/ci/retry.sh 3 rustup toolchain install "$RUST_VERSION" --profile minimal && rustup default "$RUST_VERSION"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: { shared-key: ci-profile, save-if: false }
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: { path: _cc0, key: "cc0-models-${{ hashFiles('research/cc0-models.tsv') }}" }
      # Downloaded from its publisher and checked against its pin; an unreachable host skips the daylight tests.
      - run: |
          st=0; python3 tools/ci/fetch-cc0-models.py research/cc0-models.tsv _cc0 || st=$?
          [ $st = 2 ] && echo "::warning::CC0 model host unreachable; the daylight tests skip"
          [ $st = 0 ] && printf 'RVT_DAYLIGHT_DEMO_RVT=%s\nRVT_DAYLIGHT_REQUIRE=1\n' "$PWD/_cc0/demo-building-2027.rvt" >> "$GITHUB_ENV"
          [ $st = 0 ] || [ $st = 2 ]
      - run: cargo test --profile ci -p daylight-rt -- --nocapture
      # The demo building's sun settings, which the viewer's Daylight panel starts from.
      - name: Sun settings of the demo building
        if: env.RVT_DAYLIGHT_DEMO_RVT != ''
        run: cargo run --profile ci --example sun_settings -- "$RVT_DAYLIGHT_DEMO_RVT"

  # Radiance 6.0.3 (gensky, gendaylit, oconv, rtrace) compiled to WebAssembly for the viewer's validated daylight
  # tier, in Emscripten's image pinned by digest, cached by the build script and patch; then checked against native
  # Radiance's daylight factor on the CC0 demo building (tools/radiance/check-demo.mjs).
  radiance:
    name: Radiance (WebAssembly) against native Radiance
    needs: scope
    if: needs.scope.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: { path: radiance-wasm, key: "radiance-wasm-${{ hashFiles('tools/radiance/build-wasm.sh', 'tools/radiance/o_default.patch') }}" }
      - if: steps.cache.outputs.cache-hit != 'true'
        run: tools/radiance/build-wasm.sh radiance-wasm
      - run: (cd radiance-wasm && sha256sum -c --quiet SHA256SUMS)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "24.22.1" }
      - run: node tools/radiance/check-demo.mjs radiance-wasm
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: radiance-wasm, path: radiance-wasm, retention-days: 3 }

  test:
    name: tests ${{ matrix.part }}/4
    needs: samples
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: tools/ci/retry.sh 3 rustup toolchain install "$RUST_VERSION" --profile minimal && rustup default "$RUST_VERSION"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: { shared-key: ci-profile, save-if: false }
      # A failed prebuilt download is built from crates.io instead.
      - id: tools5
        continue-on-error: true
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with: { tool: cargo-nextest@0.9.146 }
      - if: steps.tools5.outcome == 'failure'
        shell: bash
        run: tools/ci/install-cargo-tools.sh "cargo-nextest@0.9.146"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: { path: _samples, key: "samples-v1-${{ hashFiles('research/autodesk-sample-projects.tsv', 'research/bim4lca-models.tsv', 'tools/ci/fetch-public-samples.sh') }}", fail-on-cache-miss: true }
      - run: sed "s|^\([A-Z0-9_]*=\).*/_samples/|\1$GITHUB_WORKSPACE/_samples/|" _samples/env >> "$GITHUB_ENV"
      - name: Real-file, CLI and contract tests (partition ${{ matrix.part }} of ${{ env.PARTITIONS }})
        run: tools/ci/verify-real-files.sh --profile ci --partition "count:${{ matrix.part }}/${{ env.PARTITIONS }}" --no-fail-fast

  # The browser package is built in two jobs side by side, one per module,
  # with the scripts tools/ci/wasm-package.sh runs for the release; the job
  # "wasm32 and wasm64" then puts them together and checks the package.
  wasm32:
    name: wasm32 module
    needs: scope
    if: needs.scope.outputs.skip != 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: |
          tools/ci/retry.sh 3 rustup toolchain install "$RUST_VERSION" --profile minimal -c clippy -t wasm32-unknown-unknown
          rustup default "$RUST_VERSION"
          echo "WB=$(awk '$0 == "name = \"wasm-bindgen\"" { getline; gsub(/[^0-9.]/, ""); print }' Cargo.lock)" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # A failed prebuilt download is built from crates.io instead.
      - id: tools6
        continue-on-error: true
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with: { tool: "wasm-bindgen@${{ env.WB }},cargo-cyclonedx@0.5.9" }
      - if: steps.tools6.outcome == 'failure'
        shell: bash
        run: tools/ci/install-cargo-tools.sh "wasm-bindgen@${{ env.WB }},cargo-cyclonedx@0.5.9"
      - run: cargo clippy -p rvt-wasm --all-targets -- -D warnings
      # The release's SBOMs for both browser targets, so a tag is never the first run of these commands.
      - name: SBOM for the 32-bit module
        run: |
          cargo cyclonedx --manifest-path rvt-wasm/Cargo.toml --format json --spec-version 1.5 --all \
            --target wasm32-unknown-unknown --override-filename sbom32
          test -s rvt-wasm/sbom32.json
      - run: tools/ci/wasm32-build.sh pkg
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: wasm32-module, path: pkg, retention-days: 1 }

  wasm64:
    name: wasm64 module
    needs: scope
    if: needs.scope.outputs.skip != 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: |
          tools/ci/retry.sh 3 rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
          tools/ci/retry.sh 3 rustup toolchain install nightly-2026-10-30 --profile minimal -c rust-src
          echo "WB=$(awk '$0 == "name = \"wasm-bindgen\"" { getline; gsub(/[^0-9.]/, ""); print }' Cargo.lock)" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # A failed prebuilt download is built from crates.io instead.
      - id: tools8
        continue-on-error: true
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with: { tool: "wasm-bindgen@${{ env.WB }},cargo-cyclonedx@0.5.9" }
      - if: steps.tools8.outcome == 'failure'
        shell: bash
        run: tools/ci/install-cargo-tools.sh "wasm-bindgen@${{ env.WB }},cargo-cyclonedx@0.5.9"
      - name: SBOM for the 64-bit module
        run: |
          RUSTUP_TOOLCHAIN=nightly-2026-10-30 cargo cyclonedx --manifest-path rvt-wasm/Cargo.toml --format json --spec-version 1.5 --all \
            --target wasm64-unknown-unknown --override-filename sbom64
          test -s rvt-wasm/sbom64.json
      - run: tools/ci/wasm64-build.sh pkg
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: wasm64-module, path: pkg, retention-days: 1 }

  wasm:
    name: wasm32 and wasm64
    needs: [wasm32, wasm64]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { pattern: wasm*-module, merge-multiple: true, path: pkg }
      # The package the release ships: 32-bit and 64-bit builds and the loader, in one folder.
      - run: tools/ci/wasm-package.sh pkg --assemble
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: wasm-pkg, path: pkg }

  mcp:
    name: MCP server (rvt-open-mcp)
    needs: scope
    if: needs.scope.outputs.skip != 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: tools/ci/retry.sh 3 rustup toolchain install "$RUST_VERSION" --profile minimal -c clippy && rustup default "$RUST_VERSION"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: { shared-key: ci-profile, save-if: false }
      # A crate of its own (rmcp and tokio stay out of the core library), so
      # the workspace jobs do not reach its lints or its end-to-end test.
      - run: cargo clippy -p rvt-open-mcp --all-targets --no-deps -- -D warnings
      # Stdio only: the dependency tree carries no HTTP client or server.
      - run: tools/ci/audit-mcp-network.sh
      # docs/mcp-tools.md is rendered from docs/mcp-tools.json.
      - run: python3 tools/ci/render-mcp-tools.py --check
      - name: Real sample projects (MIT)
        uses: ./.github/actions/fetch-corpus
        with: { repository: magnetar-io/revit-test-datasets, path: _project_corpus }
      # The end-to-end test drives the built server over stdio on the
      # synthetic fixture and on Einhoven, and compares its exports byte for
      # byte with rvt-ifc's and rvt-gltf's.
      - name: MCP server end to end
        env:
          RVT_PROJECT_CORPUS_DIR: ${{ github.workspace }}/_project_corpus/Revit
          RVT_REQUIRE_CLI_PARITY: "1"
        run: |
          cargo build --profile ci --bin rvt-ifc --bin rvt-gltf
          cargo test --profile ci -p rvt-open-mcp --no-fail-fast

  formats:
    name: Format validators
    needs: samples
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: tools/ci/retry.sh 3 rustup toolchain install "$RUST_VERSION" --profile minimal && rustup default "$RUST_VERSION"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: { shared-key: ci-profile, save-if: false }
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: { path: _samples, key: "samples-v1-${{ hashFiles('research/autodesk-sample-projects.tsv', 'research/bim4lca-models.tsv', 'tools/ci/fetch-public-samples.sh') }}", fail-on-cache-miss: true }
      - run: cargo build --profile ci --features sqlite --bin rvt-ifc --bin rvt-gltf --bin rvt-schedule --bin rvt-sheet && cargo build --profile ci -p rvt-dwg --bin rvt-dwg
      - name: Export public samples and run each format's official validator
        run: |
          s=_samples/2024; n=_samples/bim4lca/ARCH/REVIT/ARK_NordicLCA_Housing_Concrete_BuildingPermit.rvt
          files=("$s/racbasicsampleproject.rvt" "$s/racadvancedsampleproject.rvt" "$s/rstbasicsampleproject.rvt" "$s/rmebasicsampleproject.rvt")
          [ -f "$n" ] && files+=("$n") || echo "::warning::BIM4LCA model not fetched: not validated"
          tools/ci/validators/public-check.sh target/ci "${files[@]}"
      # Every room's plan area and outline against Revit's own export of the
      # same project (tools/re/space_profiles_vs_ifc.py), on the two projects
      # whose rooms were measured whole: Core Interior (Revit 2024) and RE1
      # Architecture (Revit 2025). The minimums are the measured counts in
      # area, outline and boundary; `--match globalid` keeps a room that loses
      # Revit's GlobalId from pairing by position instead.
      - name: Real sample projects with Revit's exports (MIT)
        uses: ./.github/actions/fetch-corpus
        with: { repository: magnetar-io/revit-test-datasets, path: _project_corpus }
      - name: Room areas and outlines against Revit's exports
        run: |
          set -euo pipefail
          base=https://raw.githubusercontent.com/Drshelden/IFC-ECS/9e8b37175a0fba1397f7011aeee917fe52de7623/data/RE1
          dir=_project_corpus/Revit
          while read -r name sum; do
            curl -sSfL --retry 5 --retry-all-errors -o "$dir/$name" "$base/$name"
            echo "$sum  $dir/$name" | sha256sum -c -
          done <<'LIST'
          RE1-Architecture.rvt 4a78bdd68e7f4dd7806060db07c222da9a810e20b3f303c17a443294b91c8ce4
          RE1-Architecture.ifc a9b5d36677aa6a8bb91b77d8bc354ed9028a7ca3e9e2491a47ba14cfd8e26200
          LIST
          python3 -m venv "$RUNNER_TEMP/ifc" && "$RUNNER_TEMP/ifc/bin/pip" install -q --require-hashes -r tools/ci/requirements-ifc.txt
          target/ci/rvt-ifc "$dir/2024_Core_Interior.rvt" -o "$RUNNER_TEMP/core-interior.ifc"
          target/ci/rvt-ifc "$dir/RE1-Architecture.rvt" -o "$RUNNER_TEMP/re1-architecture.ifc"
          "$RUNNER_TEMP/ifc/bin/python" tools/re/space_profiles_vs_ifc.py "$RUNNER_TEMP/core-interior.ifc" \
            "_project_corpus/IFC Exports/2024_Core_Interior_slim.ifc" \
            --match globalid --min-in-both 116 --min-area 116 --min-outline 116 --min-boundary 116
          "$RUNNER_TEMP/ifc/bin/python" tools/re/space_profiles_vs_ifc.py "$RUNNER_TEMP/re1-architecture.ifc" \
            "$dir/RE1-Architecture.ifc" \
            --match globalid --min-in-both 11 --min-area 11 --min-outline 11 --min-boundary 11
      # Einhoven (Revit 2023) has one Level, which Revit's own IFC4 exports
      # write as their one storey, with the GlobalId below, holding the wall,
      # its two windows and the curtain wall (tests/fixtures/project-counts/
      # revit-ifc5-einhoven.json).
      - name: Einhoven's storey against Revit's export
        run: |
          target/ci/rvt-ifc _project_corpus/Revit/Revit_IFC5_Einhoven.rvt -o "$RUNNER_TEMP/einhoven.ifc"
          "$RUNNER_TEMP/ifc/bin/python" - "$RUNNER_TEMP/einhoven.ifc" <<'PY'
          import sys
          import ifcopenshell
          f = ifcopenshell.open(sys.argv[1])
          storeys = f.by_type("IfcBuildingStorey")
          got = [(s.GlobalId, s.Name, float(s.Elevation or 0.0)) for s in storeys]
          assert got == [("3V7WWv02fDhAgcYNgjNa6g", "Level 1", 0.0)], got
          held = {e.Tag for r in storeys[0].ContainsElements for e in r.RelatedElements}
          assert {"2808", "5317", "5388", "7187"} <= held, held
          print("Einhoven: one storey, Level 1, holding", sorted(held))
          PY
      - name: Element table read back with openpyxl, pyarrow and sqlite3
        run: |
          d=$RUNNER_TEMP/table; mkdir -p "$d"
          for f in jsonl xlsx parquet sqlite; do
            target/ci/rvt-schedule _samples/2024/racbasicsampleproject.rvt --format "$f" -o "$d/t.elements.$f"
          done
          python3 -m venv "$RUNNER_TEMP/py"
          "$RUNNER_TEMP/py/bin/pip" install -q --require-hashes -r tools/ci/requirements-test.txt
          RVT_TABLE_DIR="$d" "$RUNNER_TEMP/py/bin/pytest" -q -rs tests/python/test_table_readback.py
          "$RUNNER_TEMP/py/bin/pytest" -q -rs tests/python/test_maintainer_audit.py
      - name: 3D PDF structure (qpdf), U3D stream header and poster render (poppler)
        run: |
          # Bounded and retried: a hung Ubuntu mirror would otherwise use the whole job timeout.
          for attempt in 1 2 3; do timeout 180 sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y -qq qpdf poppler-utils > /dev/null && break; [ $attempt = 3 ] && exit 1; echo "::warning::apt attempt $attempt did not finish; retrying"; sleep 15; done
          tools/ci/pdf3d-check.sh target/ci _samples/2024/racbasicsampleproject.rvt _samples/2024/rstbasicsampleproject.rvt
      - name: Sheet and plan view PDF (qpdf, poppler render, segments against the DXF)
        run: tools/ci/sheet-pdf-check.sh target/ci _samples/2024/racbasicsampleproject.rvt A102 "Level 1"

  # The example notebooks (examples/notebooks, marimo): each runs top to bottom as a script on a public
  # sample and fails on any error or failed assertion, then exports to static HTML for the artifact.
  # They import the Python bindings from a wheel this job builds, and call rvt-schedule and rvt-sheet.
  notebooks:
    name: Example notebooks
    needs: samples
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: tools/ci/retry.sh 3 rustup toolchain install "$RUST_VERSION" --profile minimal && rustup default "$RUST_VERSION"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: { shared-key: ci-profile, save-if: false }
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: { path: _samples, key: "samples-v1-${{ hashFiles('research/autodesk-sample-projects.tsv', 'research/bim4lca-models.tsv', 'tools/ci/fetch-public-samples.sh') }}", fail-on-cache-miss: true }
      - name: Build the Python wheel and the two tools the notebooks call
        run: |
          python3 -m venv "$RUNNER_TEMP/nb"
          "$RUNNER_TEMP/nb/bin/pip" install -q --require-hashes -r tools/ci/requirements-notebooks.txt
          PATH="$RUNNER_TEMP/nb/bin:$PATH" maturin build --profile ci -o "$RUNNER_TEMP/wheel"
          "$RUNNER_TEMP/nb/bin/pip" install -q --no-deps "$RUNNER_TEMP"/wheel/rvt_open-*.whl
          cargo build --profile ci --features sqlite --bin rvt-schedule --bin rvt-sheet
      - name: Run each notebook as a script and export it to HTML
        env:
          RVT_MODEL: ${{ github.workspace }}/_samples/2024/racbasicsampleproject.rvt
          RVT_BIN_DIR: ${{ github.workspace }}/target/ci
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/notebooks-html"
          cd "$RUNNER_TEMP" # not the source tree, so `import rvt_open` is the installed wheel
          for nb in "$GITHUB_WORKSPACE"/examples/notebooks/*.py; do
            echo "::group::$(basename "$nb")"
            "$RUNNER_TEMP/nb/bin/python" "$nb"
            "$RUNNER_TEMP/nb/bin/marimo" export html "$nb" -o "$RUNNER_TEMP/notebooks-html/$(basename "$nb" .py).html"
            echo "::endgroup::"
          done
          ls -l "$RUNNER_TEMP/notebooks-html"
      # The same numbers the Pyodide job checks, from the native wheel: both read tools/ci/pyodide/expected-basic-sample.json.
      - name: Native counts for the Pyodide comparison
        env:
          RVT_MODEL: ${{ github.workspace }}/_samples/2024/racbasicsampleproject.rvt
        run: |
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/nb/bin/python" "$GITHUB_WORKSPACE/tools/ci/pyodide/ops.py" "$RVT_MODEL" native \
            | "$RUNNER_TEMP/nb/bin/python" "$GITHUB_WORKSPACE/tools/ci/pyodide/compare.py"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: example-notebooks-html
          path: ${{ runner.temp }}/notebooks-html/*.html
          if-no-files-found: error

  # The Python bindings as a Pyodide wheel (wasm32-unknown-emscripten), so the example notebooks run in a browser
  # with no install: the wheel is built with pinned tools (tools/ci/pyodide), notebook 01's calls run under Node and
  # Pyodide and must give the native numbers, and the notebook exported as a static site (marimo html-wasm) is
  # opened in Chromium, Firefox and WebKit. The wheel and the site are artifacts; nothing is published.
  pyodide:
    name: Pyodide wheel and notebook site
    needs: [scope, samples]
    if: needs.scope.outputs.skip != 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: tools/ci/retry.sh 3 rustup toolchain install "$RUST_VERSION" --profile minimal -t wasm32-unknown-emscripten && rustup default "$RUST_VERSION"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: { shared-key: pyodide }
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with: { tool: "uv@0.13.5" }
      - name: Python 3.14 environment (hash-pinned)
        run: |
          uv venv --python 3.14 "$RUNNER_TEMP/pw"
          uv pip install --python "$RUNNER_TEMP/pw/bin/python" --require-hashes --only-binary :all: -r tools/ci/pyodide/requirements.txt
          echo "$RUNNER_TEMP/pw/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$RUNNER_TEMP/pw" >> "$GITHUB_ENV"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: { path: ~/emsdk, key: "emsdk-5.0.3-a620cf1d71c62dfdfbb0c01fe0a371e2af2dda6c" }
      - name: Build the wheel
        run: tools/ci/pyodide/build-wheel.sh "$RUNNER_TEMP/wheel"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: { path: _samples, key: "samples-v1-${{ hashFiles('research/autodesk-sample-projects.tsv', 'research/bim4lca-models.tsv', 'tools/ci/fetch-public-samples.sh') }}", fail-on-cache-miss: true }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "24.22.1" }
      - name: Notebook 01's calls under Node and Pyodide, against the native numbers
        working-directory: tools/ci/pyodide
        run: |
          npm ci --ignore-scripts
          wheel=$(ls "$RUNNER_TEMP"/wheel/rvt_open-*.whl)
          ls -l "$wheel"
          node node-check.mjs "$wheel" "$GITHUB_WORKSPACE/_samples/2024/racbasicsampleproject.rvt" | tee "$RUNNER_TEMP/node.out"
          python3 compare.py < "$RUNNER_TEMP/node.out"
      - name: Export notebook 01 as a static site
        run: |
          wheel=$(ls "$RUNNER_TEMP"/wheel/rvt_open-*.whl)
          tools/ci/pyodide/make-site.sh "$wheel" "$RUNNER_TEMP/site" http://127.0.0.1:8765/model.rvt
      - name: The site in Chromium, Firefox and WebKit
        working-directory: tools/ci/pyodide
        run: |
          ../retry.sh 3 npx playwright install --with-deps chromium firefox webkit
          node site-check.mjs "$RUNNER_TEMP/site" "$GITHUB_WORKSPACE/_samples/2024/racbasicsampleproject.rvt" chromium firefox webkit
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pyodide-wheel
          path: ${{ runner.temp }}/wheel/*.whl
          if-no-files-found: ignore
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notebook-01-site
          path: ${{ runner.temp }}/site
          if-no-files-found: ignore
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notebook-01-site-shots
          path: tools/ci/pyodide/site-shots
          if-no-files-found: ignore

  # The tiny reference models are exported in four parts side by side (each
  # model once: rvt-ifc writes the IFC4 and the IFCX, with --ifcx-unused-types
  # so the unused types are measured too, and rvt-schedule the element table),
  # then one job scores every export against the answer keys and measures the
  # IFCX coverage, as one job did before.
  tiny-export:
    name: tiny reference models / export ${{ matrix.part }}/4
    needs: scope
    if: needs.scope.outputs.skip != 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: tools/ci/retry.sh 3 rustup toolchain install "$RUST_VERSION" --profile minimal && rustup default "$RUST_VERSION"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: { shared-key: ci-profile, save-if: false }
      # Small projects saved in every release from 2018 to 2027, each with an
      # answer key read from the Revit API: recipes 1-5 (release fixtures-tiny-1)
      # and 6-22 (fixtures-tiny-2), both MIT. The key changes with either pin.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: { path: _tiny, key: "tiny-models-${{ hashFiles('tools/ci/fetch-tiny-models.sh') }}" }
      - run: tools/ci/fetch-tiny-models.sh _tiny
      - run: cargo build --profile ci --bin rvt-ifc --bin rvt-schedule --bin rvt-dump
      # A second reader of the OLE container (olefile, pinned with hashes):
      # every tiny model's stream names, stored sizes and stored bytes, and the
      # committed family fixture's, must be the ones rvt-dump reads. Once, in
      # the first part.
      - name: Container streams against a second reader
        if: matrix.part == 1
        run: |
          python3 -m venv "$RUNNER_TEMP/ole" && "$RUNNER_TEMP/ole/bin/pip" install -q --require-hashes -r tools/ci/requirements-olefile.txt
          "$RUNNER_TEMP/ole/bin/python" tools/ci/olefile_streams.py target/ci/rvt-dump _tiny tests/fixtures/families/empty.rfa
      - name: Export part ${{ matrix.part }} of the models
        run: |
          python3 -m venv "$RUNNER_TEMP/ifc" && "$RUNNER_TEMP/ifc/bin/pip" install -q --require-hashes -r tools/ci/requirements-ifc.txt
          "$RUNNER_TEMP/ifc/bin/python" tools/ci/tiny_models_check.py _tiny target/ci "$RUNNER_TEMP/tiny-out" --ifcx --rvt-ifc-arg=--ifcx-unused-types --convert-only "${{ matrix.part }}/4"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: "tiny-exports-${{ matrix.part }}", path: "${{ runner.temp }}/tiny-out", retention-days: 1 }

  # How completely one file is decoded, on three axes (tools/full-decode,
  # docs/full-decode.md): every byte of 1-hip-roof (Revit 2024) classified,
  # every element of its Revit API dump located and its attributes compared,
  # every parameter value compared. Fails when a total falls below
  # tools/full-decode/floor.tsv.
  full-decode:
    name: full decode of one tiny model
    needs: scope
    if: needs.scope.outputs.skip != 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: tools/ci/retry.sh 3 rustup toolchain install "$RUST_VERSION" --profile minimal && rustup default "$RUST_VERSION"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: { shared-key: ci-profile, save-if: false }
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: { path: _tiny, key: "tiny-models-${{ hashFiles('tools/ci/fetch-tiny-models.sh') }}" }
      - run: tools/ci/fetch-tiny-models.sh _tiny
      - run: cargo build --profile ci --example full_decode
      - name: Bytes, elements and values against the Revit API dump
        run: |
          m=_tiny/rvt-open-tiny-models-1/2024/1-hip-roof
          target/ci/examples/full_decode "$m.rvt" > "$RUNNER_TEMP/facts.json"
          python3 -m venv "$RUNNER_TEMP/ole" && "$RUNNER_TEMP/ole/bin/pip" install -q --require-hashes -r tools/ci/requirements-olefile.txt
          "$RUNNER_TEMP/ole/bin/python" tools/full-decode/full_decode.py "$m.rvt" "$m.api-dump.json" "$RUNNER_TEMP/facts.json" "$RUNNER_TEMP/full-decode" --floor tools/full-decode/floor.tsv
      # Every tiny model's sun settings and view display options against its Revit API dump.
      - name: Sun settings and view display against the Revit API dumps
        run: |
          cargo test --profile ci --test integration -- --nocapture sun_settings::
        env: { RVT_TINY_DIR: "${{ github.workspace }}/_tiny", RVT_SUN_REQUIRE: "1" }
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: full-decode, path: "${{ runner.temp }}/full-decode", if-no-files-found: ignore }

  # The .frag texture sidecar drawn by the public loader: the synthetic
  # models of tests/material_textures.rs (one with a shell cut into pieces)
  # in @thatopen/fragments with examples/frag-textures, every sample's run
  # of vertices taking its texture coordinates exactly.
  frag-textures:
    name: .frag textures in the public loader
    needs: scope
    if: needs.scope.outputs.skip != 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: tools/ci/retry.sh 3 rustup toolchain install "$RUST_VERSION" --profile minimal && rustup default "$RUST_VERSION"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: { shared-key: ci-profile, save-if: false }
      - name: Write the synthetic models' .frag files and sidecars
        run: RVT_TEXTURE_OUT="$PWD/examples/frag-textures/public" cargo test --profile ci --test integration -- material_textures::frag
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "24.22.1" }
      - name: Draw them with their sidecars
        working-directory: examples/frag-textures
        run: |
          npm ci --ignore-scripts
          ../../tools/ci/retry.sh 3 npx playwright install --with-deps chromium
          npx playwright test

  tiny-models:
    name: tiny reference models
    needs: tiny-export
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: { path: _tiny, key: "tiny-models-${{ hashFiles('tools/ci/fetch-tiny-models.sh') }}" }
      - run: tools/ci/fetch-tiny-models.sh _tiny
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { pattern: tiny-exports-*, merge-multiple: true, path: "${{ runner.temp }}/tiny-out" }
      - name: Exports against the answer keys
        run: |
          python3 -m venv "$RUNNER_TEMP/ifc" && "$RUNNER_TEMP/ifc/bin/pip" install -q --require-hashes -r tools/ci/requirements-ifc.txt
          "$RUNNER_TEMP/ifc/bin/python" tools/ci/tiny_models_check.py _tiny target/ci "$RUNNER_TEMP/tiny-out" --no-run
      # How much of what the Revit API reports (each model's api-dump.json) the
      # IFC4 and IFCX exports carry, by kind; fails when an IFCX total drops
      # below tools/ifcx-coverage/floor.tsv or below IFC4's (docs/ifcx-coverage.md).
      - name: IFCX coverage of the Revit API's information
        run: |
          "$RUNNER_TEMP/ifc/bin/python" tools/ifcx-coverage/coverage.py _tiny "$RUNNER_TEMP/ifcx-coverage" --exports "$RUNNER_TEMP/tiny-out" --floor tools/ifcx-coverage/floor.tsv
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tiny-models-checks
          path: |
            ${{ runner.temp }}/tiny-out/tiny-models-checks.tsv
            ${{ runner.temp }}/ifcx-coverage/ifcx-coverage.tsv
          if-no-files-found: ignore

  # The viewer draws its first drawing from the model the open kept (rvt-sheet --viewer-model); when none is kept it
  # exports the file again (rvt-sheet without the flag). The two must draw the same SVG, byte for byte.
  sheet-identity:
    name: first drawing from the kept model equals the re-export
    needs: [scope, samples]
    if: needs.scope.outputs.skip != 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: tools/ci/retry.sh 3 rustup toolchain install "$RUST_VERSION" --profile minimal && rustup default "$RUST_VERSION"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: { shared-key: ci-profile, save-if: false }
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: { path: _samples, key: "samples-v1-${{ hashFiles('research/autodesk-sample-projects.tsv', 'research/bim4lca-models.tsv', 'tools/ci/fetch-public-samples.sh') }}", fail-on-cache-miss: true }
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: { path: _bim4lca, key: "bim4lca-office-terrain-${{ hashFiles('research/bim4lca-models.tsv') }}" }
      - run: |
          st=0; python3 tools/ci/fetch-bim4lca.py research/bim4lca-models.tsv _bim4lca ARK_NordicLCA_Office_Terrain_Concrete_BuildingPermit.rvt || st=$?
          [ $st = 0 ] || [ $st = 2 ]
      # The three largest BIM4LCA architectural files (CC BY-SA 4.0), read by byte range from the archive.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: { path: _bim4lca_big, key: "bim4lca-big-${{ hashFiles('research/bim4lca-models.tsv') }}" }
      - run: |
          for f in ARK_NordicLCA_Housing_Concrete_BuildingPermit.rvt ARK_NordicLCA_Housing_Timber_BuildingPermit.rvt ARK_NordicLCA_Office_Concrete_BuildingPermit.rvt; do
            st=0; python3 tools/ci/fetch-bim4lca.py research/bim4lca-models.tsv _bim4lca_big "$f" || st=$?
            [ $st = 0 ] || [ $st = 2 ] || exit 1
          done
      - run: cargo build --profile ci --bin rvt-sheet
      - name: Draw one sheet of each file both ways (AR01 of the BIM4LCA files, A1 of the Technical School)
        run: |
          big="$PWD/_bim4lca_big"
          tools/ci/sheet-identity.sh target/ci/rvt-sheet \
            "$PWD/_bim4lca/ARK_NordicLCA_Office_Terrain_Concrete_BuildingPermit.rvt:AR01" \
            "$PWD/_samples/flat/2026-Technicalschoolcurrentm.rvt:A1" \
            "$big/ARK_NordicLCA_Housing_Concrete_BuildingPermit.rvt:AR01" \
            "$big/ARK_NordicLCA_Housing_Timber_BuildingPermit.rvt:AR01" \
            "$big/ARK_NordicLCA_Office_Concrete_BuildingPermit.rvt:AR01"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: sheet-identity, path: sheet-identity-out, if-no-files-found: ignore, retention-days: 3 }

  # The browser tests run on the wasm package the release ships (both builds), once
  # per build (the viewer is built with RVT_VIEWER_BITS set, so the whole suite runs
  # on the 32-bit build, then on the 64-bit one), each in two legs split by the
  # tests' measured times (2026-11-09: 237 s in all; the four Core Interior
  # tests 40 to 60 s each, the rest under 15 s): leg 2 holds two of the long
  # tests and the orbit, diagnostics and toast tests (about 110 s), leg 1 the
  # rest (about 127 s). Re-balance when a leg runs much longer than the other.
  # Every public sample through the Daylight panel's instant tier and Radiance's daylight factor (preview), at a
  # 1 m grid, in eight shards; on request only (workflow_dispatch with daylight_sweep). Each shard's table is in
  # its artifact (samples.md).
  daylight-sweep:
    name: daylight on every public sample / shard ${{ matrix.shard }}
    if: github.event_name == 'workflow_dispatch' && inputs.daylight_sweep
    needs: [wasm, samples, radiance]
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      RVT_VIEWER_BITS: 64
      RVT_DAYLIGHT_SAMPLES_DIR: ${{ github.workspace }}/_samples/flat;${{ github.workspace }}/_samples/bim4lca
      RVT_DAYLIGHT_SHARD: ${{ matrix.shard }}/8
      RVT_DAYLIGHT_ANALYSES: sunhours,svf,df,rad-df
      RVT_DAYLIGHT_RUN_S: "1500"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: wasm-pkg, path: viewer/pkg }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: radiance-wasm, path: viewer/public/radiance }
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: { path: _samples, key: "samples-v1-${{ hashFiles('research/autodesk-sample-projects.tsv', 'research/bim4lca-models.tsv', 'tools/ci/fetch-public-samples.sh') }}", fail-on-cache-miss: true }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "24.22.1" }
      - name: Every Daylight analysis on this shard's samples
        working-directory: viewer
        run: |
          npm install -g pnpm@12.6.0
          pnpm install --frozen-lockfile
          ../tools/ci/retry.sh 3 pnpm exec playwright install --with-deps chromium
          pnpm exec tsc --noEmit && pnpm exec vite build
          pnpm exec playwright test tests/daylight-samples.spec.ts --workers 1
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: "daylight-sweep-${{ matrix.shard }}"
          path: viewer/daylight-shots/samples.*
          if-no-files-found: ignore
          retention-days: 14
  viewer:
    name: viewer (Playwright) / ${{ matrix.bits }}-bit leg ${{ matrix.leg }}
    needs: [wasm, samples, radiance]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        bits: [32, 64]
        leg: [1, 2]
    env:
      # The decoder build the viewer uses by default in this job (vite.config.ts).
      RVT_VIEWER_BITS: ${{ matrix.bits }}
      LEG2: "butt-joins|stops against at T joints|dragging to orbit|exposes geometry diagnostics|raises a toast"
      # A public project with sheets for tests/model-drawings.spec.ts (BIM4LCA, CC BY-SA 4.0).
      RVT_DRAWINGS_MODEL: ${{ github.workspace }}/_bim4lca/ARK_NordicLCA_Office_Terrain_Concrete_BuildingPermit.rvt
      # A public project that links another (BIM4LCA, CC BY-SA 4.0) for tests/model-links.spec.ts, in the 64-bit legs.
      RVT_LINKS_HOST: ${{ matrix.bits == 64 && format('{0}/_bim4lca/ARK_NordicLCA_Housing_Concrete_BuildingPermit.rvt', github.workspace) || '' }}
      RVT_LINKS_CHILD: ${{ matrix.bits == 64 && format('{0}/_bim4lca/ARK_NordicLCA_Housing_Terrain-Concrete_BuildingPermit.rvt', github.workspace) || '' }}
      # Autodesk's metric Technical School sample (public download) for tests/sheet-lineweights.spec.ts.
      RVT_SHEETS_MODEL: ${{ github.workspace }}/_samples/flat/2026-Technicalschoolcurrentm.rvt
      # tests/daylight-samples.spec.ts: the instant tier and Radiance's daylight factor on real public samples
      # (path|grid spacing in metres; ? marks the CC0 model, whose host may be unreachable), in the 64-bit legs;
      # its table is in the daylight artifact (samples.md).
      RVT_DAYLIGHT_SAMPLES: ${{ matrix.bits == 64 && format('?{0}/viewer/public/demos/cc0-2027-demo-building.rvt;{0}/viewer/public/demos/2024_Core_Interior.rvt|1;{0}/_samples/flat/2026-Technicalschoolcurrentm.rvt|2', github.workspace) || '' }}
      RVT_DAYLIGHT_ANALYSES: sunhours,svf,df,rad-df
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: wasm-pkg, path: viewer/pkg }
      # Radiance's WebAssembly build, served beside the page as radiance/ (the daylight panel loads it on demand).
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: radiance-wasm, path: viewer/public/radiance }
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: { path: _samples, key: "samples-v1-${{ hashFiles('research/autodesk-sample-projects.tsv', 'research/bim4lca-models.tsv', 'tools/ci/fetch-public-samples.sh') }}", fail-on-cache-miss: true }
      - name: Real sample projects for the demo gallery (MIT)
        uses: ./.github/actions/fetch-corpus
        with: { repository: magnetar-io/revit-test-datasets, path: _project_corpus }
      - name: Family samples for the demo gallery
        uses: ./.github/actions/fetch-corpus
        with: { repository: phi-ag/rvt, path: _corpus }
      # This project's tiny reference models (release assets, MIT): the gallery's stairs, curtain wall, doors, rooms and other examples.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: { path: _tiny, key: "tiny-models-${{ hashFiles('tools/ci/fetch-tiny-models.sh') }}" }
      - run: tools/ci/fetch-tiny-models.sh _tiny
      # The CC0 demo building (from its publisher, research/cc0-models.tsv): the gallery's daylight example.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: { path: _cc0, key: "cc0-models-${{ hashFiles('research/cc0-models.tsv') }}" }
      # Downloaded from its publisher and checked against its pin; an unreachable host skips the daylight tests.
      - run: |
          st=0; python3 tools/ci/fetch-cc0-models.py research/cc0-models.tsv _cc0 || st=$?
          [ $st = 2 ] && echo "::warning::CC0 model host unreachable; the daylight tests skip"
          [ $st = 0 ] || [ $st = 2 ]
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: { path: _bim4lca, key: "bim4lca-office-terrain-housing-links-${{ hashFiles('research/bim4lca-models.tsv') }}" }
      # Read by byte range from the archive and checked against its pin; an unreachable host skips those tests.
      - run: |
          st=0; python3 tools/ci/fetch-bim4lca.py research/bim4lca-models.tsv _bim4lca ARK_NordicLCA_Office_Terrain_Concrete_BuildingPermit.rvt ARK_NordicLCA_Housing_Concrete_BuildingPermit.rvt ARK_NordicLCA_Housing_Terrain-Concrete_BuildingPermit.rvt || st=$?
          [ $st = 2 ] && echo "::warning::BIM4LCA host unreachable; the drawings and links tests skip"
          [ $st = 0 ] || [ $st = 2 ]
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "24.22.1" }
      - name: Shell, exports (3D PDF included) and the no-network invariant
        working-directory: viewer
        run: |
          npm install -g pnpm@12.6.0
          pnpm install --frozen-lockfile
          ../tools/ci/retry.sh 3 pnpm exec playwright install --with-deps chromium
          pnpm run build
          for f in Revit_IFC5_Einhoven.rvt 2024_Core_Interior.rvt I_Single-Flush.rfa rac_basic_sample_family_2024.rfa tiny-2026-13-stairs.rvt tiny-2024-14-curtain-wall.rvt tiny-2024-16-door-window-flips.rvt tiny-2025-12-columns-beams.rvt tiny-2024-21-mep-basics.rvt tiny-2025-22-families.rvt tiny-2023-4-rooms.rvt tiny-2018-1-hip-roof.rvt cc0-2027-demo-building.rvt; do
            [ "$f" = cc0-2027-demo-building.rvt ] && [ ! -s ../_cc0/demo-building-2027.rvt ] && continue
            test -s "public/demos/$f" || { echo "::error::demo $f was not staged: the gallery would have nothing to draw"; exit 1; }
          done
          specs=(tests/viewer-regression.spec.ts tests/gallery-examples.spec.ts tests/no-network.spec.ts tests/dwg-pane.spec.ts tests/model-drawings.spec.ts tests/model-links.spec.ts tests/drawing-select.spec.ts tests/sheet-lineweights.spec.ts tests/wasm-build.spec.ts tests/wasm-no-network-imports.spec.ts tests/large-model-retry.spec.ts tests/memory-ceiling.spec.ts tests/memory-ceiling-capped.spec.ts tests/large-model-reuse.spec.ts tests/daylight.spec.ts tests/daylight-samples.spec.ts tests/view-display.spec.ts)
          if [ "${{ matrix.leg }}" = 2 ]; then
            pnpm exec playwright test "${specs[@]}" --grep "$LEG2"
          else
            pnpm exec playwright test "${specs[@]}" --grep-invert "$LEG2"
          fi
      # The model-drawings test's screenshots of the sheet and section it draws.
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: "viewer-drawings-${{ matrix.bits }}-bit-leg-${{ matrix.leg }}"
          path: viewer/drawing-shots
          if-no-files-found: ignore
          retention-days: 7
      # The daylight test's screenshots of the panel and its grid.
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: "viewer-daylight-${{ matrix.bits }}-bit-leg-${{ matrix.leg }}"
          path: viewer/daylight-shots
          if-no-files-found: ignore
          retention-days: 7
