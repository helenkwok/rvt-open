name: CI
# CI for rvt-open. Every action is pinned to a full commit SHA.
# Test data: public samples only (Autodesk's own sample downloads, VTT's BIM4LCA models), fetched by
# tools/ci/fetch-public-samples.sh and cached. Tests whose files have no public source skip and say so.
on:
  push:
    branches: [main]
  # A draft pull request runs the fast jobs (samples, box check, fmt, clippy,
  # rvt-dwg); marking it ready runs the rest. No job waits for another unless
  # it uses what that job makes, so they all start together.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # A draft's fast run and the full run marking it ready starts are in groups
  # of their own, so marking a draft ready does not cancel its fast run.
  group: ci-${{ github.ref }}-${{ github.event.pull_request.draft && 'fast' || 'full' }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.98.0"
  PARTITIONS: 4

jobs:
  identity:
    name: identity check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, fetch-depth: 0 }
      - run: tools/ci/identity-check.sh
        env:
          IDENTITY_DENYLIST: ${{ secrets.IDENTITY_DENYLIST }}
          IDENTITY_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
      - if: github.event_name == 'pull_request'
        run: tools/ci/identity-check.sh --commits "$BASE..$HEAD"
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          IDENTITY_DENYLIST: ${{ secrets.IDENTITY_DENYLIST }}
          IDENTITY_FORK_PR: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
  # What the change can affect (tools/ci/change-scope.sh): a pull request of
  # prose alone runs no Rust job, and a push to main of a tree whose pull
  # request already passed the full jobs runs none again. The changelog
  # fragments are checked here, so a prose-only change still is.
  scope:
    name: what the change can affect
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      skip: ${{ steps.scope.outputs.skip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: python3 tools/release/changelog.py check
      - id: scope
        run: tools/ci/change-scope.sh >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.sha }}
  samples:
    name: Fetch public samples
    needs: scope
    if: needs.scope.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: { path: _samples, key: "samples-v1-${{ hashFiles('research/autodesk-sample-projects.tsv', 'research/bim4lca-models.tsv', 'tools/ci/fetch-public-samples.sh') }}", lookup-only: true }
      - if: steps.cache.outputs.cache-hit != 'true'
        run: tools/ci/fetch-public-samples.sh _samples > _samples.env && cat _samples.env
      - if: steps.cache.outputs.cache-hit != 'true'
        run: mv _samples.env _samples/env
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: { path: _samples, key: "samples-v1-${{ hashFiles('research/autodesk-sample-projects.tsv', 'research/bim4lca-models.tsv', 'tools/ci/fetch-public-samples.sh') }}" }

  box-check:
    name: Box check
    needs: samples
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: tools/ci/retry.sh 3 rustup toolchain install "$RUST_VERSION" --profile minimal && rustup default "$RUST_VERSION"
      # The one job that saves the ci-profile cache (the others only restore
      # it), so the cache holds what it held when every job waited for this one.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: { shared-key: ci-profile }
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: { path: _samples, key: "samples-v1-${{ hashFiles('research/autodesk-sample-projects.tsv', 'research/bim4lca-models.tsv', 'tools/ci/fetch-public-samples.sh') }}", fail-on-cache-miss: true }
      - run: sed "s|^\([A-Z0-9_]*=\).*/_samples/|\1$GITHUB_WORKSPACE/_samples/|" _samples/env >> "$GITHUB_ENV"
      - name: Einhoven (MIT, Revit 2023)
        uses: ./.github/actions/fetch-corpus
        with: { repository: magnetar-io/revit-test-datasets, path: _project_corpus }
      - run: echo "RVT_PROJECT_CORPUS_DIR=$GITHUB_WORKSPACE/_project_corpus/Revit" >> "$GITHUB_ENV"
      - run: cargo run --profile ci --example box_check -- tools/ci/box-baseline.tsv
        env: { BOX_CHECK_JOBS: "3" }

  fmt:
    name: cargo fmt
    needs: scope
    if: needs.scope.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: tools/ci/retry.sh 3 rustup toolchain install "$RUST_VERSION" --profile minimal -c rustfmt && rustup default "$RUST_VERSION"
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy and docs
    needs: scope
    if: needs.scope.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: tools/ci/retry.sh 3 rustup toolchain install "$RUST_VERSION" --profile minimal -c clippy && rustup default "$RUST_VERSION"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo check --lib --bins
        env: { RUSTFLAGS: "-D warnings -D unnameable_types" }
      - run: cargo doc --no-deps --lib
        env: { RUSTDOCFLAGS: "-D warnings" }

  build:
    name: build / ${{ matrix.os }}
    needs: scope
    if: needs.scope.outputs.skip != 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: tools/ci/retry.sh 3 rustup toolchain install "${{ env.RUST_VERSION }}" --profile minimal && rustup default "${{ env.RUST_VERSION }}"
        shell: bash
      # The hosted Ubuntu image ships about 30 GB of SDKs this job never uses; the debug build of the
      # whole workspace plus the ClamAV image no longer fit beside them.
      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --workspace --lib --bins --all-features
      - run: cargo test --profile ci --doc
      - run: cargo run --profile ci --example basics_inspect
      - run: cargo run --profile ci --example basics_elements

  # The same binaries build / ubuntu-24.04 builds (the same command on the same
  # runner image, restoring the same cache), scanned beside it rather than after it.
  clamav:
    name: ClamAV scan of the built binaries
    needs: scope
    if: needs.scope.outputs.skip != 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      # The hosted image ships about 30 GB of SDKs this job never uses; the debug build of the whole
      # workspace plus the ClamAV image do not fit beside them. Removed while the build runs.
      - run: |
          (sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL; touch "$RUNNER_TEMP/freed") &
          tools/ci/retry.sh 3 rustup toolchain install "$RUST_VERSION" --profile minimal && rustup default "$RUST_VERSION"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: { shared-key: build, save-if: false }
      - run: cargo build --workspace --lib --bins --all-features
      # The signature database, a day at a time: freshclam then fetches only what changed since.
      - id: date
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: { path: "${{ runner.temp }}/clamav-db", key: "clamav-db-${{ steps.date.outputs.day }}", restore-keys: clamav-db- }
      # ClamAV (GPL-2.0) runs here as a separate program only; it is never linked into or shipped with rvt-open.
      - name: ClamAV scan of the built binaries (official clamav image, pinned in the script)
        env: { CLAMAV_DB: "${{ runner.temp }}/clamav-db" }
        run: |
          while [ ! -e "$RUNNER_TEMP/freed" ]; do sleep 5; done; df -h /
          tools/ci/clamav-scan.sh "$RUNNER_TEMP/clamav.md" "$RUNNER_TEMP/clamav.log" $(find target/debug -maxdepth 1 -type f -executable -name 'rvt-*')
          cat "$RUNNER_TEMP/clamav.md" >> "$GITHUB_STEP_SUMMARY"
          grep '^TIME: ' "$RUNNER_TEMP/clamav.log"

  dwg:
    name: rvt-dwg (DWG/DXF, ACadSharp samples)
    needs: scope
    if: needs.scope.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: tools/ci/retry.sh 3 rustup toolchain install "$RUST_VERSION" --profile minimal && rustup default "$RUST_VERSION"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: { shared-key: ci-profile, save-if: false }
      - id: dwg-samples
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: { path: _dwg_samples, key: "dwg-samples-${{ hashFiles('rvt-dwg/tools/fetch-acadsharp-samples.sh') }}" }
      # MIT sample drawings, pinned by commit and SHA-256 in the script.
      - run: rvt-dwg/tools/fetch-acadsharp-samples.sh _dwg_samples
      - run: cargo test --profile ci -p rvt-dwg
        env: { RVT_DWG_SAMPLES: "${{ github.workspace }}/_dwg_samples" }

  test:
    name: tests ${{ matrix.part }}/4
    needs: samples
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: tools/ci/retry.sh 3 rustup toolchain install "$RUST_VERSION" --profile minimal && rustup default "$RUST_VERSION"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: { shared-key: ci-profile, save-if: false }
      # A failed prebuilt download is built from crates.io instead.
      - id: tools5
        continue-on-error: true
        uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        with: { tool: cargo-nextest@0.9.146 }
      - if: steps.tools5.outcome == 'failure'
        shell: bash
        run: tools/ci/install-cargo-tools.sh "cargo-nextest@0.9.146"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: { path: _samples, key: "samples-v1-${{ hashFiles('research/autodesk-sample-projects.tsv', 'research/bim4lca-models.tsv', 'tools/ci/fetch-public-samples.sh') }}", fail-on-cache-miss: true }
      - run: sed "s|^\([A-Z0-9_]*=\).*/_samples/|\1$GITHUB_WORKSPACE/_samples/|" _samples/env >> "$GITHUB_ENV"
      - name: Real-file, CLI and contract tests (partition ${{ matrix.part }} of ${{ env.PARTITIONS }})
        run: tools/ci/verify-real-files.sh --profile ci --partition "count:${{ matrix.part }}/${{ env.PARTITIONS }}" --no-fail-fast

  # The browser package is built in two jobs side by side, one per module,
  # with the scripts tools/ci/wasm-package.sh runs for the release; the job
  # "wasm32 and wasm64" then puts them together and checks the package.
  wasm32:
    name: wasm32 module
    needs: scope
    if: needs.scope.outputs.skip != 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: |
          tools/ci/retry.sh 3 rustup toolchain install "$RUST_VERSION" --profile minimal -c clippy -t wasm32-unknown-unknown
          rustup default "$RUST_VERSION"
          echo "WB=$(awk '$0 == "name = \"wasm-bindgen\"" { getline; gsub(/[^0-9.]/, ""); print }' Cargo.lock)" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # A failed prebuilt download is built from crates.io instead.
      - id: tools6
        continue-on-error: true
        uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        with: { tool: "wasm-bindgen@${{ env.WB }},cargo-cyclonedx@0.5.9" }
      - if: steps.tools6.outcome == 'failure'
        shell: bash
        run: tools/ci/install-cargo-tools.sh "wasm-bindgen@${{ env.WB }},cargo-cyclonedx@0.5.9"
      - run: cargo clippy -p rvt-wasm --all-targets -- -D warnings
      # The release's SBOMs for both browser targets, so a tag is never the first run of these commands.
      - name: SBOM for the 32-bit module
        run: |
          cargo cyclonedx --manifest-path rvt-wasm/Cargo.toml --format json --spec-version 1.5 --all \
            --target wasm32-unknown-unknown --override-filename sbom32
          test -s rvt-wasm/sbom32.json
      - run: tools/ci/wasm32-build.sh pkg
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: wasm32-module, path: pkg, retention-days: 1 }
      # The viewer's package, from the same 32-bit build, under the name the viewer loads.
      - run: wasm-bindgen --target web --out-dir viewer/pkg --out-name rvt target/wasm32-unknown-unknown/release/rvt_wasm.wasm
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: viewer-pkg, path: viewer/pkg, retention-days: 3 }

  wasm64:
    name: wasm64 module
    needs: scope
    if: needs.scope.outputs.skip != 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: |
          tools/ci/retry.sh 3 rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
          tools/ci/retry.sh 3 rustup toolchain install nightly-2026-10-30 --profile minimal -c rust-src
          echo "WB=$(awk '$0 == "name = \"wasm-bindgen\"" { getline; gsub(/[^0-9.]/, ""); print }' Cargo.lock)" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # A failed prebuilt download is built from crates.io instead.
      - id: tools8
        continue-on-error: true
        uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        with: { tool: "wasm-bindgen@${{ env.WB }},cargo-cyclonedx@0.5.9" }
      - if: steps.tools8.outcome == 'failure'
        shell: bash
        run: tools/ci/install-cargo-tools.sh "wasm-bindgen@${{ env.WB }},cargo-cyclonedx@0.5.9"
      - name: SBOM for the 64-bit module
        run: |
          RUSTUP_TOOLCHAIN=nightly-2026-10-30 cargo cyclonedx --manifest-path rvt-wasm/Cargo.toml --format json --spec-version 1.5 --all \
            --target wasm64-unknown-unknown --override-filename sbom64
          test -s rvt-wasm/sbom64.json
      - run: tools/ci/wasm64-build.sh pkg
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: wasm64-module, path: pkg, retention-days: 1 }

  wasm:
    name: wasm32 and wasm64
    needs: [wasm32, wasm64]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { pattern: wasm*-module, merge-multiple: true, path: pkg }
      # The package the release ships: 32-bit and 64-bit builds and the loader, in one folder.
      - run: tools/ci/wasm-package.sh pkg --assemble
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: wasm-pkg, path: pkg }

  mcp:
    name: MCP server (rvt-open-mcp)
    needs: scope
    if: needs.scope.outputs.skip != 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: tools/ci/retry.sh 3 rustup toolchain install "$RUST_VERSION" --profile minimal -c clippy && rustup default "$RUST_VERSION"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: { shared-key: ci-profile, save-if: false }
      # A crate of its own (rmcp and tokio stay out of the core library), so
      # the workspace jobs do not reach its lints or its end-to-end test.
      - run: cargo clippy -p rvt-open-mcp --all-targets --no-deps -- -D warnings
      # Stdio only: the dependency tree carries no HTTP client or server.
      - run: tools/ci/audit-mcp-network.sh
      # docs/mcp-tools.md is rendered from docs/mcp-tools.json.
      - run: python3 tools/ci/render-mcp-tools.py --check
      - name: Real sample projects (MIT)
        uses: ./.github/actions/fetch-corpus
        with: { repository: magnetar-io/revit-test-datasets, path: _project_corpus }
      # The end-to-end test drives the built server over stdio on the
      # synthetic fixture and on Einhoven, and compares its exports byte for
      # byte with rvt-ifc's and rvt-gltf's.
      - name: MCP server end to end
        env:
          RVT_PROJECT_CORPUS_DIR: ${{ github.workspace }}/_project_corpus/Revit
          RVT_REQUIRE_CLI_PARITY: "1"
        run: |
          cargo build --profile ci --bin rvt-ifc --bin rvt-gltf
          cargo test --profile ci -p rvt-open-mcp --no-fail-fast

  formats:
    name: Format validators
    needs: samples
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: tools/ci/retry.sh 3 rustup toolchain install "$RUST_VERSION" --profile minimal && rustup default "$RUST_VERSION"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: { shared-key: ci-profile, save-if: false }
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: { path: _samples, key: "samples-v1-${{ hashFiles('research/autodesk-sample-projects.tsv', 'research/bim4lca-models.tsv', 'tools/ci/fetch-public-samples.sh') }}", fail-on-cache-miss: true }
      - run: cargo build --profile ci --features sqlite --bin rvt-ifc --bin rvt-gltf --bin rvt-schedule --bin rvt-sheet && cargo build --profile ci -p rvt-dwg --bin rvt-dwg
      - name: Export public samples and run each format's official validator
        run: |
          s=_samples/2024; n=_samples/bim4lca/ARCH/REVIT/ARK_NordicLCA_Housing_Concrete_BuildingPermit.rvt
          files=("$s/racbasicsampleproject.rvt" "$s/racadvancedsampleproject.rvt" "$s/rstbasicsampleproject.rvt" "$s/rmebasicsampleproject.rvt")
          [ -f "$n" ] && files+=("$n") || echo "::warning::BIM4LCA model not fetched: not validated"
          tools/ci/validators/public-check.sh target/ci "${files[@]}"
      # Every room's plan area and outline against Revit's own export of the
      # same project (tools/re/space_profiles_vs_ifc.py), on the two projects
      # whose rooms were measured whole: Core Interior (Revit 2024) and RE1
      # Architecture (Revit 2025). The minimums are the measured counts in
      # area, outline and boundary; `--match globalid` keeps a room that loses
      # Revit's GlobalId from pairing by position instead.
      - name: Real sample projects with Revit's exports (MIT)
        uses: ./.github/actions/fetch-corpus
        with: { repository: magnetar-io/revit-test-datasets, path: _project_corpus }
      - name: Room areas and outlines against Revit's exports
        run: |
          set -euo pipefail
          base=https://raw.githubusercontent.com/Drshelden/IFC-ECS/9e8b37175a0fba1397f7011aeee917fe52de7623/data/RE1
          dir=_project_corpus/Revit
          while read -r name sum; do
            curl -sSfL --retry 5 --retry-all-errors -o "$dir/$name" "$base/$name"
            echo "$sum  $dir/$name" | sha256sum -c -
          done <<'LIST'
          RE1-Architecture.rvt 4a78bdd68e7f4dd7806060db07c222da9a810e20b3f303c17a443294b91c8ce4
          RE1-Architecture.ifc a9b5d36677aa6a8bb91b77d8bc354ed9028a7ca3e9e2491a47ba14cfd8e26200
          LIST
          python3 -m venv "$RUNNER_TEMP/ifc" && "$RUNNER_TEMP/ifc/bin/pip" install -q --require-hashes -r tools/ci/requirements-ifc.txt
          target/ci/rvt-ifc "$dir/2024_Core_Interior.rvt" -o "$RUNNER_TEMP/core-interior.ifc"
          target/ci/rvt-ifc "$dir/RE1-Architecture.rvt" -o "$RUNNER_TEMP/re1-architecture.ifc"
          "$RUNNER_TEMP/ifc/bin/python" tools/re/space_profiles_vs_ifc.py "$RUNNER_TEMP/core-interior.ifc" \
            "_project_corpus/IFC Exports/2024_Core_Interior_slim.ifc" \
            --match globalid --min-in-both 116 --min-area 116 --min-outline 116 --min-boundary 116
          "$RUNNER_TEMP/ifc/bin/python" tools/re/space_profiles_vs_ifc.py "$RUNNER_TEMP/re1-architecture.ifc" \
            "$dir/RE1-Architecture.ifc" \
            --match globalid --min-in-both 11 --min-area 11 --min-outline 11 --min-boundary 11
      # Einhoven (Revit 2023) has one Level, which Revit's own IFC4 exports
      # write as their one storey, with the GlobalId below, holding the wall,
      # its two windows and the curtain wall (tests/fixtures/project-counts/
      # revit-ifc5-einhoven.json).
      - name: Einhoven's storey against Revit's export
        run: |
          target/ci/rvt-ifc _project_corpus/Revit/Revit_IFC5_Einhoven.rvt -o "$RUNNER_TEMP/einhoven.ifc"
          "$RUNNER_TEMP/ifc/bin/python" - "$RUNNER_TEMP/einhoven.ifc" <<'PY'
          import sys
          import ifcopenshell
          f = ifcopenshell.open(sys.argv[1])
          storeys = f.by_type("IfcBuildingStorey")
          got = [(s.GlobalId, s.Name, float(s.Elevation or 0.0)) for s in storeys]
          assert got == [("3V7WWv02fDhAgcYNgjNa6g", "Level 1", 0.0)], got
          held = {e.Tag for r in storeys[0].ContainsElements for e in r.RelatedElements}
          assert {"2808", "5317", "5388", "7187"} <= held, held
          print("Einhoven: one storey, Level 1, holding", sorted(held))
          PY
      - name: Element table read back with openpyxl, pyarrow and sqlite3
        run: |
          d=$RUNNER_TEMP/table; mkdir -p "$d"
          for f in jsonl xlsx parquet sqlite; do
            target/ci/rvt-schedule _samples/2024/racbasicsampleproject.rvt --format "$f" -o "$d/t.elements.$f"
          done
          python3 -m venv "$RUNNER_TEMP/py"
          "$RUNNER_TEMP/py/bin/pip" install -q --require-hashes -r tools/ci/requirements-test.txt
          RVT_TABLE_DIR="$d" "$RUNNER_TEMP/py/bin/pytest" -q -rs tests/python/test_table_readback.py
      - name: 3D PDF structure (qpdf), U3D stream header and poster render (poppler)
        run: |
          # Bounded and retried: a hung Ubuntu mirror would otherwise use the whole job timeout.
          for attempt in 1 2 3; do timeout 180 sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y -qq qpdf poppler-utils > /dev/null && break; [ $attempt = 3 ] && exit 1; echo "::warning::apt attempt $attempt did not finish; retrying"; sleep 15; done
          tools/ci/pdf3d-check.sh target/ci _samples/2024/racbasicsampleproject.rvt _samples/2024/rstbasicsampleproject.rvt
      - name: Sheet and plan view PDF (qpdf, poppler render, segments against the DXF)
        run: tools/ci/sheet-pdf-check.sh target/ci _samples/2024/racbasicsampleproject.rvt A102 "Level 1"

  # The tiny reference models are exported in four parts side by side (each
  # model once: rvt-ifc writes the IFC4 and the IFCX, with --ifcx-unused-types
  # so the unused types are measured too, and rvt-schedule the element table),
  # then one job scores every export against the answer keys and measures the
  # IFCX coverage, as one job did before.
  tiny-export:
    name: tiny reference models / export ${{ matrix.part }}/4
    needs: scope
    if: needs.scope.outputs.skip != 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: tools/ci/retry.sh 3 rustup toolchain install "$RUST_VERSION" --profile minimal && rustup default "$RUST_VERSION"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: { shared-key: ci-profile, save-if: false }
      # Small projects saved in every release from 2018 to 2027, each with an
      # answer key read from the Revit API: recipes 1-5 (release fixtures-tiny-1)
      # and 6-22 (fixtures-tiny-2), both MIT. The key changes with either pin.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: { path: _tiny, key: "tiny-models-${{ hashFiles('tools/ci/fetch-tiny-models.sh') }}" }
      - run: tools/ci/fetch-tiny-models.sh _tiny
      - run: cargo build --profile ci --bin rvt-ifc --bin rvt-schedule
      - name: Export part ${{ matrix.part }} of the models
        run: |
          python3 -m venv "$RUNNER_TEMP/ifc" && "$RUNNER_TEMP/ifc/bin/pip" install -q --require-hashes -r tools/ci/requirements-ifc.txt
          "$RUNNER_TEMP/ifc/bin/python" tools/ci/tiny_models_check.py _tiny target/ci "$RUNNER_TEMP/tiny-out" --ifcx --rvt-ifc-arg=--ifcx-unused-types --convert-only "${{ matrix.part }}/4"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: "tiny-exports-${{ matrix.part }}", path: "${{ runner.temp }}/tiny-out", retention-days: 1 }

  tiny-models:
    name: tiny reference models
    needs: tiny-export
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: { path: _tiny, key: "tiny-models-${{ hashFiles('tools/ci/fetch-tiny-models.sh') }}" }
      - run: tools/ci/fetch-tiny-models.sh _tiny
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { pattern: tiny-exports-*, merge-multiple: true, path: "${{ runner.temp }}/tiny-out" }
      - name: Exports against the answer keys
        run: |
          python3 -m venv "$RUNNER_TEMP/ifc" && "$RUNNER_TEMP/ifc/bin/pip" install -q --require-hashes -r tools/ci/requirements-ifc.txt
          "$RUNNER_TEMP/ifc/bin/python" tools/ci/tiny_models_check.py _tiny target/ci "$RUNNER_TEMP/tiny-out" --no-run
      # How much of what the Revit API reports (each model's api-dump.json) the
      # IFC4 and IFCX exports carry, by kind; fails when an IFCX total drops
      # below tools/ifcx-coverage/floor.tsv or below IFC4's (docs/ifcx-coverage.md).
      - name: IFCX coverage of the Revit API's information
        run: |
          "$RUNNER_TEMP/ifc/bin/python" tools/ifcx-coverage/coverage.py _tiny "$RUNNER_TEMP/ifcx-coverage" --exports "$RUNNER_TEMP/tiny-out" --floor tools/ifcx-coverage/floor.tsv
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tiny-models-checks
          path: |
            ${{ runner.temp }}/tiny-out/tiny-models-checks.tsv
            ${{ runner.temp }}/ifcx-coverage/ifcx-coverage.tsv
          if-no-files-found: ignore

  # The browser tests run in two legs on the one wasm package (the 32-bit build
  # the release's package is made from), split by the
  # tests' measured times (2026-11-09: 237 s in all; the four Core Interior
  # tests 40 to 60 s each, the rest under 15 s): leg 2 holds two of the long
  # tests and the orbit, diagnostics and toast tests (about 110 s), leg 1 the
  # rest (about 127 s). Re-balance when a leg runs much longer than the other.
  viewer:
    name: viewer (Playwright) / leg ${{ matrix.leg }}
    needs: wasm32
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        leg: [1, 2]
    env:
      LEG2: "butt-joins|stops against at T joints|dragging to orbit|exposes geometry diagnostics|raises a toast"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: viewer-pkg, path: viewer/pkg }
      - name: Real sample projects for the demo gallery (MIT)
        uses: ./.github/actions/fetch-corpus
        with: { repository: magnetar-io/revit-test-datasets, path: _project_corpus }
      - name: Family samples for the demo gallery
        uses: ./.github/actions/fetch-corpus
        with: { repository: phi-ag/rvt, path: _corpus }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "24.22.1" }
      - name: Shell, exports (3D PDF included) and the no-network invariant
        working-directory: viewer
        run: |
          npm install -g pnpm@12.6.0
          pnpm install --frozen-lockfile
          ../tools/ci/retry.sh 3 pnpm exec playwright install --with-deps chromium
          pnpm run build
          for f in Revit_IFC5_Einhoven.rvt 2024_Core_Interior.rvt; do
            test -s "public/demos/$f" || { echo "::error::demo $f was not staged: the gallery would have nothing to draw"; exit 1; }
          done
          specs=(tests/viewer-regression.spec.ts tests/no-network.spec.ts tests/dwg-pane.spec.ts)
          if [ "${{ matrix.leg }}" = 2 ]; then
            pnpm exec playwright test "${specs[@]}" --grep "$LEG2"
          else
            pnpm exec playwright test "${specs[@]}" --grep-invert "$LEG2"
          fi
