name: Release
# On a version tag: CLI binaries for Linux, macOS and Windows, and the WebAssembly package, attached to a GitHub release.
# Every archive ships with a build provenance attestation, a CycloneDX SBOM, a Trivy report on that SBOM,
# an entry in SHA256SUMS, a ClamAV scan that must be clean before anything is published and, for each
# scanning service whose key is set (VirusTotal, MetaDefender Cloud, Hybrid Analysis), an upload. The
# results are in the scans.md asset, except Hybrid Analysis's, which are printed to this workflow's log.
# How to check them: SECURITY.md, "Verifying a release".
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
env:
  RUST_VERSION: "1.98.0"
jobs:
  cli:
    name: CLI / ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-15, target: aarch64-apple-darwin }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          - { os: windows-2025, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: rustup toolchain install "${{ env.RUST_VERSION }}" --profile minimal -t ${{ matrix.target }} && rustup default "${{ env.RUST_VERSION }}"
      - uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        with: { tool: cargo-cyclonedx@0.5.9 }
      - run: cargo build --release --locked --bins -p rvt-open -p rvt-dwg --features rvt-open/sqlite --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          d=rvt-open-${GITHUB_REF_NAME}-${{ matrix.target }}; mkdir "$d"
          for f in target/${{ matrix.target }}/release/rvt-*; do case $f in *.d|*.pdb) ;; *) [ -f "$f" ] && [ -x "$f" -o "${f##*.}" = exe ] && cp "$f" "$d/";; esac; done
          cp LICENSE NOTICE README.md "$d/"
          if [ "$RUNNER_OS" = Windows ]; then 7z a "$d.zip" "$d" >/dev/null; else tar czf "$d.tar.gz" "$d"; fi
      - name: SBOM (CycloneDX) for the archive
        shell: bash
        run: |
          cargo cyclonedx --manifest-path Cargo.toml --format json --spec-version 1.5 --all \
            --target ${{ matrix.target }} --override-filename sbom
          mv sbom.json "rvt-open-${GITHUB_REF_NAME}-${{ matrix.target }}.cdx.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: "cli-${{ matrix.target }}", path: "rvt-open-*.*" }
  wasm:
    name: WebAssembly package
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal -t wasm32-unknown-unknown && rustup default "$RUST_VERSION"
          rustup toolchain install nightly-2026-10-30 --profile minimal -c rust-src
          echo "WB=$(awk '$0 == "name = \"wasm-bindgen\"" { getline; gsub(/[^0-9.]/, ""); print }' Cargo.lock)" >> "$GITHUB_ENV"
      - uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        with: { tool: "wasm-bindgen@${{ env.WB }},cargo-cyclonedx@0.5.9" }
      - run: |
          d=rvt-open-wasm-${GITHUB_REF_NAME}
          tools/ci/wasm-package.sh "$d"
          tar czf "$d.tar.gz" "$d"
      - name: SBOM (CycloneDX) for the wasm package
        run: |
          cargo cyclonedx --manifest-path rvt-wasm/Cargo.toml --format json --spec-version 1.5 --all \
            --target wasm32-unknown-unknown --override-filename sbom
          mv rvt-wasm/sbom.json "rvt-open-wasm-${GITHUB_REF_NAME}.cdx.json"
          cargo cyclonedx --manifest-path rvt-wasm/Cargo.toml --format json --spec-version 1.5 --all \
            --target wasm64-unknown-unknown --override-filename sbom
          mv rvt-wasm/sbom.json "rvt-open-wasm64-${GITHUB_REF_NAME}.cdx.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: wasm, path: "rvt-open-wasm-*.tar.gz\nrvt-open-wasm*.cdx.json" }
  attest:
    name: Build provenance
    needs: [cli, wasm]
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { path: dist, merge-multiple: true }
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/rvt-open-*.tar.gz
            dist/rvt-open-*.zip
  clamav:
    name: ClamAV
    needs: [cli, wasm]
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { path: dist, merge-multiple: true }
      # Fails this job, and so stops the release before publishing, if ClamAV flags any archive or unpacked file.
      - run: mkdir -p scan && tools/ci/clamav-scan.sh scan/clamav.md scan/clamav.log dist/rvt-open-*.tar.gz dist/rvt-open-*.zip
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: scan-clamav, path: scan/ }
  online-scans:
    name: Online scans (VirusTotal, MetaDefender, Hybrid Analysis)
    needs: [cli, wasm]
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    # Each service runs only when its secret exists, and never blocks the release (continue-on-error).
    # Each key is given only to its own step. Details and limits: tools/ci/online-scan.sh.
    steps:
      - id: keys
        run: |
          echo "vt=${{ secrets.VT_API_KEY != '' }}" >> "$GITHUB_OUTPUT"
          echo "md=${{ secrets.METADEFENDER_API_KEY != '' }}" >> "$GITHUB_OUTPUT"
          echo "ha=${{ secrets.HYBRID_ANALYSIS_API_KEY != '' }}" >> "$GITHUB_OUTPUT"
      - if: steps.keys.outputs.vt == 'true' || steps.keys.outputs.md == 'true' || steps.keys.outputs.ha == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - if: steps.keys.outputs.vt == 'true' || steps.keys.outputs.md == 'true' || steps.keys.outputs.ha == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { path: dist, merge-multiple: true }
      - name: VirusTotal
        if: steps.keys.outputs.vt == 'true'
        continue-on-error: true
        env: { VT_API_KEY: "${{ secrets.VT_API_KEY }}" }
        run: mkdir -p scan && tools/ci/online-scan.sh virustotal scan/virustotal.md dist/rvt-open-*.tar.gz dist/rvt-open-*.zip
      - name: MetaDefender Cloud
        if: steps.keys.outputs.md == 'true'
        continue-on-error: true
        env: { METADEFENDER_API_KEY: "${{ secrets.METADEFENDER_API_KEY }}" }
        run: mkdir -p scan && tools/ci/online-scan.sh metadefender scan/metadefender.md dist/rvt-open-*.tar.gz dist/rvt-open-*.zip
      - name: Hybrid Analysis
        if: steps.keys.outputs.ha == 'true'
        continue-on-error: true
        env: { HYBRID_ANALYSIS_API_KEY: "${{ secrets.HYBRID_ANALYSIS_API_KEY }}" }
        run: mkdir -p scan && tools/ci/online-scan.sh hybrid-analysis scan/hybrid-analysis.md dist/rvt-open-*.tar.gz dist/rvt-open-*.zip
      - if: steps.keys.outputs.vt == 'true' || steps.keys.outputs.md == 'true' || steps.keys.outputs.ha == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: scan-online, path: scan/, if-no-files-found: ignore }
  publish:
    needs: [attest, clamav, online-scans]
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { pattern: cli-*, path: dist, merge-multiple: true }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: wasm, path: dist }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { pattern: scan-*, path: scan, merge-multiple: true }
      - run: find dist -mindepth 1 -maxdepth 1 -type d -exec rm -rf {} +
      - name: scans.md (ClamAV, VirusTotal, MetaDefender, Hybrid Analysis)
        run: |
          {
            echo "# Malware scans for ${GITHUB_REF_NAME}"
            echo
            echo "How these were made and how to check a download yourself: SECURITY.md, \"Verifying a release\"."
            for s in clamav:ClamAV virustotal:VirusTotal metadefender:"MetaDefender Cloud" hybrid-analysis:"Hybrid Analysis"; do
              echo
              if [ -s "scan/${s%%:*}.md" ]; then cat "scan/${s%%:*}.md"; else printf '## %s\n\nNot run for this release.\n' "${s#*:}"; fi
            done
          } > dist/scans.md
          cp scan/clamav.log dist/clamav.log
      # Installs Trivy and scans the Linux x86_64 SBOM; the next step reuses the binary for every SBOM.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          scan-type: sbom
          scan-ref: dist/rvt-open-${{ github.ref_name }}-x86_64-unknown-linux-gnu.cdx.json
          output: ${{ runner.temp }}/trivy-first.txt
          exit-code: "0"
      - name: Trivy report per SBOM
        run: |
          for s in dist/*.cdx.json; do
            trivy sbom --cache-dir "$GITHUB_WORKSPACE/.cache/trivy" --scanners vuln --format table --exit-code 0 \
              --output "${s%.cdx.json}.trivy.txt" "$s"
          done
      - run: (cd dist && sha256sum * > SHA256SUMS) && pre=(); case "$GITHUB_REF_NAME" in *-*) pre=(--prerelease --latest=false) ;; esac && gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes "${pre[@]}"
        env: { GH_TOKEN: "${{ github.token }}" }
