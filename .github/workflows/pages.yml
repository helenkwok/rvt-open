name: Pages
# Builds the project site: the landing page in site/ plus the browser viewer at /viewer/.
# Pull requests build only; pushes to main and manual runs also deploy. Every action is pinned to a full commit SHA.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "site/**"
      - "viewer/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.98.0"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: |
          tools/ci/retry.sh 3 rustup toolchain install "$RUST_VERSION" --profile minimal -t wasm32-unknown-unknown
          rustup default "$RUST_VERSION"
          tools/ci/retry.sh 3 rustup toolchain install nightly-2026-10-30 --profile minimal -c rust-src
          echo "WB=$(awk '$0 == "name = \"wasm-bindgen\"" { getline; gsub(/[^0-9.]/, ""); print }' Cargo.lock)" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # A failed prebuilt download is built from crates.io instead.
      - id: tools3
        continue-on-error: true
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with: { tool: "wasm-bindgen@${{ env.WB }}" }
      - if: steps.tools3.outcome == 'failure'
        shell: bash
        run: tools/ci/install-cargo-tools.sh "wasm-bindgen@${{ env.WB }}"
      # Both builds, as the release ships them: the viewer loads the 64-bit one where the browser supports memory64.
      - name: Build the wasm package (32-bit and 64-bit) into viewer/pkg
        run: tools/ci/wasm-package.sh viewer/pkg
      # Radiance (gensky, gendaylit, oconv, rtrace) as WebAssembly, served as radiance/ beside the viewer.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: { path: viewer/public/radiance, key: "radiance-wasm-${{ hashFiles('tools/radiance/build-wasm.sh', 'tools/radiance/o_default.patch') }}" }
      - run: '[ -s viewer/public/radiance/rtrace.wasm ] || tools/radiance/build-wasm.sh viewer/public/radiance'
      - name: Real sample projects for the demo gallery (MIT)
        uses: ./.github/actions/fetch-corpus
        with: { repository: magnetar-io/revit-test-datasets, path: _project_corpus }
      - name: Family samples for the demo gallery
        uses: ./.github/actions/fetch-corpus
        with: { repository: phi-ag/rvt, path: _corpus }
      # This project's tiny reference models (release assets, MIT): the gallery's stairs, curtain wall, doors, rooms and other examples.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: { path: _tiny, key: "tiny-models-${{ hashFiles('tools/ci/fetch-tiny-models.sh') }}" }
      - run: tools/ci/fetch-tiny-models.sh _tiny
      # The CC0 demo building (from its publisher, research/cc0-models.tsv): the gallery's daylight example.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: { path: _cc0, key: "cc0-models-${{ hashFiles('research/cc0-models.tsv') }}" }
      # Downloaded from its publisher and checked against its pin; an unreachable host skips the daylight tests.
      - run: |
          st=0; python3 tools/ci/fetch-cc0-models.py research/cc0-models.tsv _cc0 || st=$?
          [ $st = 2 ] && echo "::warning::CC0 model host unreachable; the daylight tests skip"
          [ $st = 0 ] || [ $st = 2 ]
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "24.22.1" }
      - name: Build the viewer and check the no-network invariant
        working-directory: viewer
        run: |
          npm install -g pnpm@12.6.0
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
          pnpm run build
          for f in Revit_IFC5_Einhoven.rvt 2024_Core_Interior.rvt I_Single-Flush.rfa rac_basic_sample_family_2024.rfa tiny-2026-13-stairs.rvt tiny-2024-14-curtain-wall.rvt tiny-2024-16-door-window-flips.rvt tiny-2025-12-columns-beams.rvt tiny-2024-21-mep-basics.rvt tiny-2025-22-families.rvt tiny-2023-4-rooms.rvt tiny-2018-1-hip-roof.rvt cc0-2027-demo-building.rvt; do
            [ "$f" = cc0-2027-demo-building.rvt ] && [ ! -s ../_cc0/demo-building-2027.rvt ] && continue
            test -s "public/demos/$f" || { echo "::error::demo $f was not staged: the gallery would have nothing to draw"; exit 1; }
          done
          pnpm exec playwright test tests/no-network.spec.ts tests/wasm-no-network-imports.spec.ts
          pnpm exec playwright test tests/viewer-regression.spec.ts -g 'real-project demo card'
          pnpm exec playwright test tests/gallery-examples.spec.ts
      - name: Rebuild the viewer for its Pages path
        working-directory: viewer
        env:
          RVT_VIEWER_BASE: /rvt-open/viewer/
        run: pnpm exec vite build
      - name: Assemble the site
        run: |
          mkdir _site
          cp -R site/. _site/
          cp -R viewer/dist _site/viewer
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with: { path: _site }

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
