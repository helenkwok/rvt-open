name: OpenSSF Scorecard
# Scores the repository against the OpenSSF Scorecard checks and publishes the result (shown by the
# badge in the README, and in the Security tab).
on:
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"
  branch_protection_rule:
  workflow_dispatch:
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: scorecard-results, path: results.sarif, retention-days: 5 }
      # A failed upload (the code scanning service refusing it for a moment) is
      # tried once more, so that it does not turn the run red on its own.
      - id: sarif
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
          category: scorecard
      - if: steps.sarif.outcome == 'failure'
        run: sleep 30
      - if: steps.sarif.outcome == 'failure'
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
          category: scorecard
