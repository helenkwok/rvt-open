name: Security scans
# Dependency policy (cargo-deny) and a Trivy scan of the repository for known vulnerabilities, committed
# secrets and misconfigurations (Dockerfile, workflows). Runs on PRs, on main and weekly, so a newly
# published advisory shows up without a code change.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 3 * * 1"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-scans-${{ github.ref }}
  cancel-in-progress: true
env:
  RUST_VERSION: "1.98.0"

jobs:
  cargo-deny:
    name: cargo-deny (advisories, licences, bans, sources)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: tools/ci/retry.sh 3 rustup toolchain install "$RUST_VERSION" --profile minimal && rustup default "$RUST_VERSION"
      # A failed prebuilt download is built from crates.io instead.
      - id: tools4
        continue-on-error: true
        uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        with: { tool: cargo-deny@0.20.2 }
      - if: steps.tools4.outcome == 'failure'
        shell: bash
        run: tools/ci/install-cargo-tools.sh "cargo-deny@0.20.2"
      # Policy is in deny.toml: a RustSec advisory, a disallowed licence or an unknown source fails the job.
      - run: cargo deny --locked check

  trivy:
    name: Trivy filesystem scan
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      # Report-only for now: findings are uploaded to the Security tab and do not fail the build
      # (exit-code 0). Switch exit-code to 1 once the first results have been triaged.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy-results.sarif
          exit-code: "0"
      # A failed upload (the code scanning service refusing it for a moment) is
      # tried once more, so that it does not turn the run red on its own.
      - id: sarif
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          sarif_file: trivy-results.sarif
          category: trivy-fs
      - if: steps.sarif.outcome == 'failure'
        run: sleep 30
      - if: steps.sarif.outcome == 'failure'
        uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          sarif_file: trivy-results.sarif
          category: trivy-fs
