name: Security scans
# Dependency policy (cargo-deny) and a Trivy scan of the repository for known vulnerabilities, committed
# secrets and misconfigurations (Dockerfile, workflows). Runs on PRs, on main and weekly, so a newly
# published advisory shows up without a code change.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 3 * * 1"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-scans-${{ github.ref }}
  cancel-in-progress: true
env:
  RUST_VERSION: "1.98.0"

jobs:
  cargo-deny:
    name: cargo-deny (advisories, licences, bans, sources)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: rustup toolchain install "$RUST_VERSION" --profile minimal && rustup default "$RUST_VERSION"
      - uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
        with: { tool: cargo-deny@0.20.2 }
      # Policy is in deny.toml: a RustSec advisory, a disallowed licence or an unknown source fails the job.
      - run: cargo deny --locked check

  trivy:
    name: Trivy filesystem scan
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      # Report-only for now: findings are uploaded to the Security tab and do not fail the build
      # (exit-code 0). Switch exit-code to 1 once the first results have been triaged.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy-results.sarif
          exit-code: "0"
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy-results.sarif
          category: trivy-fs
