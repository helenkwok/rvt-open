name: Memory
# Peak memory and time of rvt-ifc and rvt-gltf on the largest public samples and two small ones,
# at a base ref and at the checked-out commit, both built on this runner (tools/ci/measure-memory.sh).
# Each model's job reports the peak by stage (RVT_STAGE_MEMORY), on request the largest
# allocators at the peak (heaptrack, on the two largest models; slow and memory-hungry, so off
# by default) and fails if any output (IFC, IFCX, .frag, .glb) differs from the base build's.
# Every action is pinned to a full commit SHA.
on:
  pull_request:
    paths:
      - .github/workflows/memory.yml
      - tools/ci/measure-memory.sh
  workflow_dispatch:
    inputs:
      base_ref:
        description: The ref measured against the checked-out commit
        default: main
      heaptrack:
        description: Also run heaptrack on the two largest models
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: memory-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.98.0"
  # Line tables and symbols for heaptrack; they change the binary, not what it writes.
  CARGO_PROFILE_RELEASE_DEBUG: line-tables-only
  CARGO_PROFILE_RELEASE_STRIP: "false"

jobs:
  build:
    name: Build ${{ matrix.side }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      matrix:
        side: [base, head]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, fetch-depth: 0 }
      - name: Check out the base ref
        if: matrix.side == 'base'
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || inputs.base_ref || 'main' }}
        run: |
          git fetch -q origin "$BASE_REF" 2> /dev/null || true
          git checkout -q --detach "$(git rev-parse --verify "origin/$BASE_REF" 2> /dev/null || echo "$BASE_REF")"
          git log --oneline -1
      - run: tools/ci/retry.sh 3 rustup toolchain install "$RUST_VERSION" --profile minimal && rustup default "$RUST_VERSION"
      - run: |
          cargo build --release --locked --bin rvt-ifc --bin rvt-gltf
          mkdir -p bin && cp target/release/rvt-ifc target/release/rvt-gltf bin/ && git rev-parse HEAD > bin/commit
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: "bin-${{ matrix.side }}", path: bin, retention-days: 3 }

  measure:
    name: ${{ matrix.model }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - { model: snowdon-architectural-2024, file: flat/2024-snowdon_towers_sample_architectural.rvt, heaptrack: heaptrack }
          - { model: nordic-office-concrete, file: bim4lca/ARK_NordicLCA_Office_Concrete_As-Built.rvt, heaptrack: heaptrack }
          - { model: nordic-housing-timber, file: bim4lca/ARK_NordicLCA_Housing_Timber_BuildingPermit.rvt }
          - { model: nordic-housing-concrete, file: bim4lca/ARK_NordicLCA_Housing_Concrete_BuildingPermit.rvt }
          - { model: rac-basic-2024, file: flat/2024-racbasicsampleproject.rvt }
          - { model: rst-basic-2024, file: flat/2024-rstbasicsampleproject.rvt }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: sudo apt-get install -y -qq time heaptrack > /dev/null
      - id: samples
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: { path: _samples, key: "samples-v1-${{ hashFiles('research/autodesk-sample-projects.tsv', 'research/bim4lca-models.tsv', 'tools/ci/fetch-public-samples.sh') }}" }
      - if: steps.samples.outputs.cache-hit != 'true'
        run: tools/ci/fetch-public-samples.sh _samples
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { pattern: "bin-*", path: bins }
      - name: Measure
        env:
          FILE: _samples/${{ matrix.file }}
          MODEL: ${{ matrix.model }}
          HT: ${{ inputs.heaptrack && matrix.heaptrack || '' }}
        run: |
          chmod +x bins/*/rvt-*
          echo "base $(cat bins/bin-base/commit), head $(cat bins/bin-head/commit)"
          [ -f "$FILE" ] || { echo "::error::$FILE was not fetched"; exit 1; }
          set +e; tools/ci/measure-memory.sh bins/bin-base bins/bin-head "out/$MODEL" "$FILE" "$HT"; st=$?; set -e
          { echo "base $(cut -c1-8 bins/bin-base/commit), head $(cut -c1-8 bins/bin-head/commit)"; echo; cat "out/$MODEL/summary.md"; } >> "$GITHUB_STEP_SUMMARY"
          exit $st
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: "memory-${{ matrix.model }}", path: out, if-no-files-found: warn }
