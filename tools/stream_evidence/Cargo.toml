[package]
name = "stream-evidence"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
publish = false
description = "Reusable stream-evidence harness checksum-paged inflate probes (control vs experimental page stripping)."
authors = ["rvt-open contributors"]

[[bin]]
name = "stream-evidence"
path = "src/main.rs"


[lints]
workspace = true

[dependencies]
rvt = { package = "rvt-open", path = "../..", version = "=0.1.0" }
flate2 = "1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
sha2 = "0.11"
hex = "0.4"
anyhow = "1"
