# Vendored unchanged from craft-libs (crates/atomic) at fe4e2ff3efe2dfc5c6f4871c968a9fb561fd5305:
# see SOURCE.md. The `workspace = true` keys of the original are written out with craft-libs'
# workspace values, and its workspace lints are copied below.
[package]
name = "craft-atomic"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.89"
repository = "https://github.com/storytold/craft-libs"
description = "Crash-safe atomic file writing and replacement for the Craft suite"
publish = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
cognitive_complexity = "deny"
too_many_arguments = "deny"
wildcard_imports = "deny"
dbg_macro = "warn"
todo = "warn"

[target.'cfg(target_vendor = "apple")'.dependencies]
rustix = { version = "1.1", default-features = false, features = ["std", "fs"] }
