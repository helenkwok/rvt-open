[package]
name = "rvt-wasm"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
description = "WebAssembly bindings for the `rvt` crate, behind the browser viewer. Kept in a separate crate so `rvt` builds as a plain `rlib`: a `cdylib` crate type on the core library linked a shared library on every native build, test run and `cargo install`."
authors = ["rvt-open contributors"]
repository = "https://github.com/helenkwok/rvt-open"
publish = false  # Built by wasm-pack into viewer/pkg, not published.

[lib]
# wasm-pack's output names come from `--out-name rvt`, so the viewer still
# loads `pkg/rvt.js` and `pkg/rvt_bg.wasm`.
crate-type = ["cdylib"]


[lints]
workspace = true

[dependencies]
# `unstable-research` only adds paths to the readers the stable API already
# reads through (src/research.rs): `savedParameters` calls the saved-parameter
# reader `rvt-elements` uses, and the release range it reads, directly. `dwg`
# draws the sheets and views (`drawingOpen`) as `rvt-sheet` does.
rvt = { package = "rvt-open", path = "..", default-features = false, features = ["unstable-research", "dwg"] }
# DWG/DXF reading for the 2D pane, without the engine's native-only parallel decoding.
rvt-dwg = { path = "../rvt-dwg", default-features = false }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"

# The element table as an SQLite database in the 32-bit build: SQLite
# compiled to wasm32 (`sqlite-wasm-rs`, through rusqlite), which needs clang
# with the wasm32 target. The 64-bit build (wasm64) has no SQLite.
[target.'cfg(target_arch = "wasm32")'.dependencies]
rvt = { package = "rvt-open", path = "..", default-features = false, features = ["sqlite"] }
# SQLite's host services (clock, local time, randomness, sleep) from the
# browser through wasm-bindgen: Date, crypto.getRandomValues, Atomics.wait.
sqlite-wasm-rs = { version = "=0.6.3", default-features = false, features = ["wasm-bindgen"] }

# wasm-pack configuration. The bundled `wasm-opt` in wasm-pack 0.14
# doesn't accept rustc's bulk-memory output — it prints a wall of
# "[wasm-validator error in function N] unexpected false: Bulk
# memory operations require bulk memory" warnings, then returns a
# non-zero exit in CI that kills the whole build (locally it also
# emits the warnings but happens to write artifacts anyway).
#
# Bulk-memory is supported in every browser ≥ 2019 (Chrome 75+,
# Firefox 79+, Safari 15+, Edge 79+), so we ship the raw output
# from wasm-bindgen-cli — 728 KB uncompressed, ~180 KB gzipped — and
# skip wasm-opt entirely. If we ever want the ~15 % size win back,
# a newer binaryen (installed out-of-band) accepts
# `--enable-bulk-memory` and the stanza can change to
# `wasm-opt = ["-O", "--enable-bulk-memory"]`.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[package.metadata.wasm-pack.profile.dev]
wasm-opt = false

[package.metadata.wasm-pack.profile.profiling]
wasm-opt = false

# zip (under the XLSX writer) needs getrandom 0.4, which turns on its browser
# backend (`wasm_js`, crypto.getRandomValues) for wasm32 only; the 64-bit
# build turns it on here.
[target.'cfg(target_arch = "wasm64")'.dependencies]
getrandom = { version = "=0.4.3", default-features = false, features = ["wasm_js"] }
